<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Sacred Suvarna Gold Gradient -->
    <linearGradient id="suvarnaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="30%" stop-color="#E5A93C" />
      <stop offset="70%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>

    <!-- Tamra Copper Gradient -->
    <linearGradient id="tamraCopper" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="50%" stop-color="#C86428" />
      <stop offset="100%" stop-color="#7C2D12" />
    </linearGradient>

    <!-- Radiant Inner Glow Gradient -->
    <radialGradient id="binduGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#E5A93C" stop-opacity="0.5" />
      <stop offset="75%" stop-color="#C86428" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#08090C" stop-opacity="0" />
    </radialGradient>

    <!-- Deep Altar Disc Gradient -->
    <radialGradient id="altarDisc" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#181410" />
      <stop offset="75%" stop-color="#0E0C09" />
      <stop offset="100%" stop-color="#08090C" />
    </radialGradient>

    <filter id="goldDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#D4AF37" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Deep Sacred Altar Disc Ground -->
  <circle cx="250" cy="250" r="240" fill="url(#altarDisc)" stroke="url(#suvarnaGold)" stroke-width="4" />
  <circle cx="250" cy="250" r="228" fill="none" stroke="url(#tamraCopper)" stroke-width="1.5" stroke-dasharray="4 6" />
  <circle cx="250" cy="250" r="216" fill="none" stroke="url(#suvarnaGold)" stroke-width="1" opacity="0.6" />

  <!-- 12 Solar Rays / Petals (Dvadasaditya) -->
  <line x1="450.0" y1="250.0" x2="465.0" y2="250.0" stroke="url(#suvarnaGold)" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
  <line x1="423.2" y1="350.0" x2="436.2" y2="357.5" stroke="url(#suvarnaGold)" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
  <line x1="350.0" y1="423.2" x2="357.5" y2="436.2" stroke="url(#suvarnaGold)" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
  <line x1="250.0" y1="450.0" x2="250.0" y2="465.0" stroke="url(#suvarnaGold)" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
  <line x1="150.0" y1="423.2" x2="142.5" y2="436.2" stroke="url(#suvarnaGold)" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
  <line x1="76.8" y1="350.0" x2="63.8" y2="357.5" stroke="url(#suvarnaGold)" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
  <line x1="50.0" y1="250.0" x2="35.0" y2="250.0" stroke="url(#suvarnaGold)" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
  <line x1="76.8" y1="150.0" x2="63.8" y2="142.5" stroke="url(#suvarnaGold)" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
  <line x1="150.0" y1="76.8" x2="142.5" y2="63.8" stroke="url(#suvarnaGold)" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
  <line x1="250.0" y1="50.0" x2="250.0" y2="35.0" stroke="url(#suvarnaGold)" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
  <line x1="350.0" y1="76.8" x2="357.5" y2="63.8" stroke="url(#suvarnaGold)" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
  <line x1="423.2" y1="150.0" x2="436.2" y2="142.5" stroke="url(#suvarnaGold)" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />

  <!-- Sacred Geometric Diamond Inscription Frame -->
  <polygon points="250,55 445,250 250,445 55,250" fill="none" stroke="url(#tamraCopper)" stroke-width="1.2" opacity="0.45" />
  <polygon points="250,68 432,250 250,432 68,250" fill="none" stroke="url(#suvarnaGold)" stroke-width="1" opacity="0.3" stroke-dasharray="3 5" />

  <!-- Radiant Bindu Aura -->
  <circle cx="250" cy="250" r="170" fill="url(#binduGlow)" />

  <!-- Concentric Inner Circle -->
  <circle cx="250" cy="250" r="160" fill="none" stroke="url(#suvarnaGold)" stroke-width="2" />
  <circle cx="250" cy="250" r="150" fill="none" stroke="url(#tamraCopper)" stroke-width="1" opacity="0.5" />

  <!-- Interlocking Sacred Triangles (Shiva & Shakti) -->
  <polygon points="250,105 130,295 370,295" fill="none" stroke="url(#suvarnaGold)" stroke-width="1.5" opacity="0.55" />
  <polygon points="250,395 130,205 370,205" fill="none" stroke="url(#tamraCopper)" stroke-width="1.5" opacity="0.55" />

  <!-- THE SACRED ANANTA (INFINITY) LOOP (Sculpted Golden Mobius Band) -->
  <!-- Left Loop -->
  <path d="M 250,250 C 210,180 120,180 120,250 C 120,320 210,320 250,250 Z" 
        fill="none" stroke="url(#suvarnaGold)" stroke-width="16" stroke-linecap="round" filter="url(#goldDropShadow)" />
  <!-- Right Loop -->
  <path d="M 250,250 C 290,320 380,320 380,250 C 380,180 290,180 250,250 Z" 
        fill="none" stroke="url(#suvarnaGold)" stroke-width="16" stroke-linecap="round" filter="url(#goldDropShadow)" />

  <!-- Inner Highlighting Lines for 3D Sculpted Copper Sheen -->
  <path d="M 250,250 C 210,180 120,180 120,250 C 120,320 210,320 250,250 Z" 
        fill="none" stroke="url(#tamraCopper)" stroke-width="6" stroke-linecap="round" opacity="0.85" />
  <path d="M 250,250 C 290,320 380,320 380,250 C 380,180 290,180 250,250 Z" 
        fill="none" stroke="url(#tamraCopper)" stroke-width="6" stroke-linecap="round" opacity="0.85" />

  <!-- Central Golden Crest Hairline -->
  <path d="M 250,250 C 210,180 120,180 120,250 C 120,320 210,320 250,250 C 290,320 380,320 380,250 C 380,180 290,180 250,250 Z" 
        fill="none" stroke="#FFFBEB" stroke-width="2" stroke-linecap="round" opacity="0.75" />

  <!-- Left Loop Core Bindu -->
  <circle cx="165" cy="250" r="12" fill="url(#suvarnaGold)" filter="url(#goldDropShadow)" />
  <circle cx="165" cy="250" r="6" fill="#FFFBEB" />

  <!-- Right Loop Core Bindu -->
  <circle cx="335" cy="250" r="12" fill="url(#suvarnaGold)" filter="url(#goldDropShadow)" />
  <circle cx="335" cy="250" r="6" fill="#FFFBEB" />

  <!-- Central Singularity / Solar Bindu Core -->
  <circle cx="250" cy="250" r="18" fill="url(#suvarnaGold)" filter="url(#goldDropShadow)" />
  <circle cx="250" cy="250" r="10" fill="#FFFBEB" />

  <!-- Sacred Devanagari Sanskrit Epigraph along bottom arc: ॥ अनन्तः ॥ -->
  <text x="250" y="412" font-family="'Cinzel', 'Marcellus', Georgia, serif" font-size="24" font-weight="bold" 
        fill="url(#suvarnaGold)" text-anchor="middle" letter-spacing="4">॥ अनन्तः ॥</text>
  <text x="250" y="102" font-family="'Cinzel', 'Marcellus', Georgia, serif" font-size="14" font-weight="600" 
        fill="url(#suvarnaGold)" text-anchor="middle" letter-spacing="6" opacity="0.8">STRANGEINFINITY</text>
</svg>